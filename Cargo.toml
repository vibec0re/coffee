[package]
name = "coffeefs"
version = "0.1.0"
edition = "2024"
description = "FUSE passthrough filesystem whose contents are linked in at runtime"
license = "Apache-2.0"
repository = "https://github.com/vibec0re/coffee"

[dependencies]
clap = { version = "4.6.9", features = ["derive"] }
env_logger = "0.11.12"
fuser = "0.19"
libc = "0.2.191"
log = "0.4.35"
nix = { version = "0.30", features = ["fs", "mount", "sched", "user", "signal", "socket", "uio", "process", "dir"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3.27.0"
